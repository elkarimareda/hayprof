version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: hayprof-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hayprof
      MYSQL_USER: hayprof_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-hayprof_secure_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker-entrypoint.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - hayprof-network
    ports:
      - "3306:3306"

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hayprof-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    networks:
      - hayprof-network
    ports:
      - "8000:80"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=hayprof
      - DB_USERNAME=hayprof_user
      - DB_PASSWORD=${DB_PASSWORD:-hayprof_secure_password}

  # Nginx (Production Ready)
  nginx:
    image: nginx:alpine
    container_name: hayprof-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/html
      - ./deployment/nginx-production.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - hayprof-network

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  nginx_logs:
    driver: local

networks:
  hayprof-network:
    driver: bridge
